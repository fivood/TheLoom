name: Deploy Mobile (PWA) to Cloudflare Pages

# 移动版(PWA)独立发布线:推送到 mobile-pwa 分支时部署到 Pages 项目 theloom-mobile,
# 与 main 的桌面安装版(项目 theloom,见 deploy.yml)互不覆盖。

on:
  push:
    branches: [mobile-pwa]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      - run: npm run build

      - name: Check Cloudflare secrets
        id: check
        env:
          CF_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          if [ -z "$CF_TOKEN" ]; then
            echo "configured=false" >> "$GITHUB_OUTPUT"
            echo "::notice::未配置 CLOUDFLARE_API_TOKEN / CLOUDFLARE_ACCOUNT_ID 密钥,跳过部署(仅验证构建)。配置方法见 docs/DEVELOPMENT.md。"
          else
            echo "configured=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Deploy Mobile PWA to Cloudflare Pages
        if: steps.check.outputs.configured == 'true'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          # 项目已存在时 create 会失败,忽略即可
          npx wrangler pages project create theloom-mobile --production-branch=mobile-pwa 2>/dev/null || true
          npx wrangler pages deploy dist --project-name=theloom-mobile --branch=mobile-pwa

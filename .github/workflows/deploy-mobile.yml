name: Deploy Web (PWA) to Cloudflare Pages

# 网页版(PWA)发布线:推送到 main 时,构建并部署到 Pages 项目 theloom 的生产分支,
# the-loom.net 即移动版(超集:桌面功能全保留 + 移动布局 + PWA 离线/安装 + IndexedDB)。
# main 同时负责桌面安装包(v* 标签 release),两者共用同一份代码,不再维护单独的发版分支。
# 桌面版更新代理 /api/update、/api/download 由本项目 functions/ 提供,不受影响。

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      - run: npm run build

      - name: Check Cloudflare secrets
        id: check
        env:
          CF_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          if [ -z "$CF_TOKEN" ]; then
            echo "configured=false" >> "$GITHUB_OUTPUT"
            echo "::notice::未配置 CLOUDFLARE_API_TOKEN / CLOUDFLARE_ACCOUNT_ID 密钥,跳过部署(仅验证构建)。配置方法见 docs/DEVELOPMENT.md。"
          else
            echo "configured=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Deploy to Cloudflare Pages (production)
        if: steps.check.outputs.configured == 'true'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          # 项目已存在时 create 会失败,忽略即可
          npx wrangler pages project create theloom --production-branch=main 2>/dev/null || true
          npx wrangler pages deploy dist --project-name=theloom --branch=main

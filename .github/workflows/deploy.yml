name: Verify Web Build (main)

# main 不再部署 Web:网页版(PWA)由 mobile-pwa 分支经 deploy-mobile.yml 发布到 the-loom.net。
# 本工作流只保证 main 的 Web 构建仍能通过(桌面安装包走 v* 标签 release.yml)。
# 完整的 main CI(测试 + 构建 + CLI + Rust)见 verify.yml。

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      - run: npm run build
